<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="styles.css">
    <title>Task Manager Assignment</title>
</head>
<body>

    <div class="container">
        <header>

            <img src="assets/menu_icon.png" alt="Menu" class="menu-icon">

            <label class="quick-find">
                <img src="assets/search_icon.png" alt="Quick Find">
                <input type="text" placeholder="Quick Find">
            </label>
        
            <div class="task-counter">
                <img src="assets/check_icon.png" alt="">
                <span>30/5</span>
            </div>

        </header>
        <nav>
            <ul>
                <li>
                    <img src="assets/inbox_icon.png" alt="">
                    <span class="label">Inbox</span>
                    <span class="count">5</span>
                </li>
                <li>
                    <img src="assets/calendar_icon.png" alt="">
                    <span class="label">Today</span>
                    <span class="count">5</span>
                </li>
                <li>
                    <img src="assets/upcoming_icon.png" alt="">
                    <span class="label">Upcoming</span>
                </li>
            </ul>
        </nav>

        <main class="#">
            <section>
                <h1>
                    Inbox
                </h1>
                <ul class="task-list">
                    <li><label><input type="radio" name="task"> Call Mom</label></li>
                    <li><label><input type="radio" name="task"> Buy the new issue of Scientific American</label></li>
                    <li><label><input type="radio" name="task"> Return the textbook to Josie</label></li>
                    <li><label><input type="radio" name="task"> Buy the new album by Rake</label></li>
                    <li><label><input type="radio" name="task"> Buy a gift card for Dad</label></li>
                </ul>
            </section>

        </main>
    </div>
</body>
</html>
