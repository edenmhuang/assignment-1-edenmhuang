<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="styles.css">
    <title>Task Manager Assignment</title>
</head>
<body>

    <div class="container">
        <header>

            <img src="assets/menu_icon.png" alt="Menu" class="menu-icon">

            <div class="quick-find">
                <img src="assets/search_icon.png" alt="">
                <input type="text" placeholder="Quick Find">
            </div>
        
            <div class="task-counter">
                <img src="assets/check_icon.png" alt="">
                <span>30/5</span>
            </div>

        </header>
        <nav>
            <section>
                <h2>
                    nav
                </h2>
                <ul>
                    <li>Inbox</li>
                    <li>Today</li>
                    <li>Upcoming</li>
                </ul>
            </section>
        </nav>

        <main class="">
            <section>
                <h2>
                    Inbox
                </h2>
                <ul>
                    <li>Call Mom</li>
                    <li>Buy the new issue of Scientific American</li>
                    <li>Return the textbook to Josie</li>
                    <li>Buy the new album by Rake</li>
                    <li>Buy a gift card for Dad</li>
                </ul>
            </section>

        </main>

        <aside class="aside">
            Aside Content
        </aside>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2024 Eden Huang. All rights reserved.</p>
            </div>
        </footer>
    </div>


</body>
</html>
